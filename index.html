<!-- تب لیست کاربران در پنل ادمین -->
<div id="admin-users" class="tab-content active">
  
  <!-- فرم افزودن مستقیم کاربر توسط ادمین -->
  <div class="glass-card add-user-box">
    <div class="add-user-header">
      <h4><i class="fa-solid fa-user-plus"></i> افزودن دستی کاربر جدید (بدون تایید ایمیل)</h4>
      <button type="button" id="toggle-add-user-btn" class="btn-sm"><i class="fa-solid fa-plus"></i> فرم جدید</button>
    </div>
    <form id="admin-add-user-form" class="hidden">
      <div class="admin-form-grid">
        <div class="input-group">
          <label>نام و نام خانوادگی:</label>
          <input type="text" id="admin-new-name" placeholder="مثال: علی رضایی" required>
        </div>
        <div class="input-group">
          <label>ایمیل کاربر:</label>
          <input type="email" id="admin-new-email" placeholder="user@gmail.com" required>
        </div>
        <div class="input-group">
          <label>رمز عبور:</label>
          <input type="text" id="admin-new-pass" placeholder="رمز عبور دلخواه" required>
        </div>
        <div class="input-group">
          <label>اعتبار اولیه:</label>
          <input type="number" id="admin-new-credit" value="15" min="0" required>
        </div>
        <div class="input-group">
          <label>نقش کاربری:</label>
          <select id="admin-new-role" class="glass-select">
            <option value="user">کاربر عادی</option>
            <option value="admin">مدیر (Admin)</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn-success" style="margin-top: 1rem;">
        <i class="fa-solid fa-check"></i> ثبت و فعال‌سازی فوری کاربر
      </button>
    </form>
  </div>

  <!-- جدول کاربران موجود -->
  <div class="table-responsive">
    <table class="glass-table">
      <thead>
        <tr>
          <th>نام</th>
          <th>ایمیل</th>
          <th>اعتبار</th>
          <th>وضعیت</th>
          <th>نقش</th>
          <th>عملیات</th>
        </tr>
      </thead>
      <tbody id="users-table-body"></tbody>
    </table>
  </div>
</div>
